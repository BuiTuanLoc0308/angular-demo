<div class="main">
  <div class="header">
    <a (click)="goBack()" class="btn-back">
      <mat-icon>arrow_back</mat-icon>
      <span>Quay lại</span>
    </a>

    <p>Tạo công thức mới</p>
  </div>

  <mat-stepper linear #stepper>
    <mat-step label="Thông tin cơ bản">
      <app-basic-info-step></app-basic-info-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext>
          <span>Tiếp tục</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Nguyên liệu">
      <app-ingredients-step></app-ingredients-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext>
          <span>Tiếp tục</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Các bước nấu">
      <app-instructions-step></app-instructions-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext>
          <span>Tiếp tục</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Hoàn tất">
      <app-review-step></app-review-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext>
          <p class="btn-submit">Hoàn tất</p>
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
