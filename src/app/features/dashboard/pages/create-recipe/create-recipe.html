<div class="main">
  <div class="header">
    <button class="btn-back" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>

      <span>{{ 'CREATE_RECIPE.BACK' | translate }}</span>
    </button>

    <h1>
      {{
        isEdit
          ? ('CREATE_RECIPE.EDIT_TITLE' | translate)
          : ('CREATE_RECIPE.CREATE_TITLE' | translate)
      }}
    </h1>
  </div>

  <mat-stepper linear #stepper [orientation]="(isMobile$ | async) ? 'vertical' : 'horizontal'">
    <mat-step [label]="'CREATE_RECIPE.BASIC_INFO' | translate" [stepControl]="basicStep.form">
      <app-basic-info-step #basicStep></app-basic-info-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext [disabled]="basicStep.form.invalid">
          <span>{{ 'CREATE_RECIPE.NEXT' | translate }}</span>

          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step
      [label]="'CREATE_RECIPE.INGREDIENTS' | translate"
      [stepControl]="ingredientsStep.form"
    >
      <app-ingredients-step #ingredientsStep></app-ingredients-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          [disabled]="ingredientsStep.form.invalid"
        >
          <span>{{ 'CREATE_RECIPE.NEXT' | translate }}</span>

          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step
      [label]="'CREATE_RECIPE.INSTRUCTIONS' | translate"
      [stepControl]="instructionsStep.form"
    >
      <app-instructions-step #instructionsStep></app-instructions-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          [disabled]="instructionsStep.form.invalid"
        >
          <span>{{ 'CREATE_RECIPE.NEXT' | translate }}</span>

          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step [label]="'CREATE_RECIPE.REVIEW' | translate">
      <app-review-step></app-review-step>

      <div class="place-btn">
        <button class="btn-next" mat-button (click)="submitRecipe()" [disabled]="isProcess">
          {{
            isProcess
              ? ('CREATE_RECIPE.PROCESSING' | translate)
              : ('CREATE_RECIPE.FINISH' | translate)
          }}
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
