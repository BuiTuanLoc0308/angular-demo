<div class="main">
  <div class="header">
    <a (click)="goBack()" class="btn-back">
      <mat-icon>arrow_back</mat-icon>
      <span>Quay lại</span>
    </a>

    <p>
      {{ isEdit ? 'Chỉnh sửa công thức' : 'Tạo công thức mới' }}
    </p>
  </div>

  <mat-stepper linear #stepper>
    <mat-step label="Thông tin cơ bản" [stepControl]="basicStep.form">
      <app-basic-info-step #basicStep></app-basic-info-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext [disabled]="basicStep.form.invalid">
          <span>Tiếp tục</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Nguyên liệu" [stepControl]="ingredientsStep.form">
      <app-ingredients-step #ingredientsStep></app-ingredients-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          [disabled]="ingredientsStep.form.invalid"
        >
          <span>Tiếp tục</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Các bước nấu" [stepControl]="instructionsStep.form">
      <app-instructions-step #instructionsStep></app-instructions-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          [disabled]="instructionsStep.form.invalid"
        >
          <span>Tiếp tục</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Hoàn tất">
      <app-review-step></app-review-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          (click)="submitRecipe()"
          [disabled]="isProcess"
        >
          <p class="btn-submit">{{ isProcess ? 'Đang xử lý...' : 'Hoàn tất' }}</p>
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
