<div class="main">
  <div class="header">
    <button class="btn-back" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      <span>Quay lại</span>
    </button>

    <h1>
      {{ isEdit ? 'Chỉnh sửa công thức' : 'Tạo công thức mới' }}
    </h1>
  </div>

  <mat-stepper linear #stepper [orientation]="(isMobile$ | async) ? 'vertical' : 'horizontal'">
    <mat-step label="Thông tin cơ bản" [stepControl]="basicStep.form">
      <app-basic-info-step #basicStep></app-basic-info-step>

      <div class="place-btn">
        <button class="btn-next" mat-button matStepperNext [disabled]="basicStep.form.invalid">
          <span>Tiếp tục</span>

          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Nguyên liệu" [stepControl]="ingredientsStep.form">
      <app-ingredients-step #ingredientsStep></app-ingredients-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          [disabled]="ingredientsStep.form.invalid"
        >
          <span>Tiếp tục</span>

          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Các bước nấu" [stepControl]="instructionsStep.form">
      <app-instructions-step #instructionsStep> </app-instructions-step>

      <div class="place-btn">
        <button
          class="btn-next"
          mat-button
          matStepperNext
          [disabled]="instructionsStep.form.invalid"
        >
          <span>Tiếp tục</span>

          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Hoàn tất">
      <app-review-step></app-review-step>

      <div class="place-btn">
        <button class="btn-next" mat-button (click)="submitRecipe()" [disabled]="isProcess">
          {{ isProcess ? 'Đang xử lý...' : 'Hoàn tất' }}
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
