<div class="auth-page">
  <div class="auth-container">
    <div class="auth-image">
      <img src="images/login.png" alt="Login" />
    </div>

    <div class="auth-card">
      <div class="logo-container">
        <img src="images/logo.png" alt="Logo" />
      </div>

      <h2 class="auth-title"><i>CulinaryFriend</i></h2>

      <div class="auth-header">
        <p class="auth-text">Đăng nhập</p>

        <p class="auth-subtitle">Rất vui được gặp lại bạn</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label>Username</label>

          <input type="email" formControlName="userName" placeholder="Enter username" />

          @if (userNameInvalid) {
            <small class="invalid-text"> Vui lòng nhập đầy đủ thông tin </small>
          }
        </div>

        <div class="form-group">
          <label>Password</label>

          <input type="password" formControlName="password" placeholder="Enter password" />

          @if (passwordInvalid) {
            <small class="invalid-text"> Password bắt buộc </small>
          }
        </div>

        <div class="option-container">
          <label class="remember">
            <input type="checkbox" id="remember" />
            Ghi nhớ đăng nhập
          </label>

          <p class="forgot">Quên mật khẩu</p>
        </div>

        <button class="btn-submit" type="submit" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Đang đăng nhập...' : 'Login' }}
        </button>

        <div class="divider">
          <span class="line"></span>

          <span class="divider-text"> Hoặc đăng nhập bằng </span>

          <span class="line"></span>
        </div>

        <div class="btn-group">
          <button>Google</button>

          <button>Facebook</button>
        </div>

        <div class="auth-footer">
          <p>Chưa có tài khoản?</p>

          <a class="auth-link" (click)="onRegister()"> Đăng ký ngay </a>
        </div>
      </form>

      <p class="message">{{ message }}</p>
    </div>
  </div>
</div>
